name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The scaffolded site's node_modules (Astro and the pinned packages), reused across runs.
      - uses: actions/cache@v4
        with:
          path: test/tmp/e2e-cache
          key: e2e-site-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package.json', 'skills/convert-site/templates/site/package.json') }}
      - run: npm test
      - run: npm run hygiene
